    position: fixed; bottom: 0; width: 50%; height: 30%;

<script type="module">
import * as THREE from 'three';

// ---------------- Fixed (internal) constants ----------------
const CFG = {
  ballRadius: 0.5,
  steerSpeedGain: 0.013, // steering force grows with forward speed: F * (1 + speed * gain)
  airDragFactor: 0.08,   // lateral drag in the air relative to grip on the ground
  slabThickness: 1.2,
  viewAhead: 260,        // how far ahead the track is generated
  keepBehind: 40,        // how far behind the track is kept before disposal
  stepTolerance: 0.35,   // how deep the ball may sink before it counts as hitting a wall
  fallLimit: 14,         // game over when this far below the last ground height
  fixedDt: 1 / 120,
};

// ---------------- User-tunable settings ----------------
const SETTINGS = [
  { group: 'Шарик' },
  { key: 'mass', label: 'Масса', min: 0.3, max: 5, step: 0.1, def: 1.2,
    desc: 'Инерция: тяжёлый шарик медленнее разгоняется вбок и дольше скользит' },
  { key: 'steerForce', label: 'Сила поворота', min: 10, max: 120, step: 1, def: 40,
    desc: 'Насколько сильно кнопки толкают шарик вбок' },
  { key: 'grip', label: 'Сцепление', min: 0.5, max: 12, step: 0.1, def: 4,
    desc: 'Боковое трение: мало — «лёд», много — шарик сразу останавливается' },
  { key: 'airControl', label: 'Управление в воздухе', min: 0, max: 1, step: 0.05, def: 0.5,
    desc: 'Доля силы поворота во время прыжка' },
  { group: 'Скорость и мир' },
  { key: 'startSpeed', label: 'Стартовая скорость', min: 6, max: 30, step: 1, def: 14, unit: ' м/с' },
  { key: 'maxSpeed', label: 'Максимальная скорость', min: 15, max: 80, step: 1, def: 46, unit: ' м/с' },
  { key: 'accel', label: 'Ускорение', min: 0, max: 2, step: 0.05, def: 0.45, unit: ' м/с²',
    desc: 'Насколько быстро растёт скорость вперёд' },
  { key: 'gravity', label: 'Гравитация', min: 10, max: 60, step: 1, def: 32, unit: ' м/с²',
    desc: 'Меньше — дольше полёт на трамплинах' },
  { group: 'Звук' },
  { key: 'musicVol', label: 'Музыка', min: 0, max: 1, step: 0.05, def: 0.5, pct: true },
  { key: 'sfxVol', label: 'Эффекты', min: 0, max: 1, step: 0.05, def: 0.7, pct: true },
];
const DEFAULTS = Object.fromEntries(SETTINGS.filter((s) => s.key).map((s) => [s.key, s.def]));
const P = { ...DEFAULTS, ...loadJSON('slopeSettings', {}) };
let muted = !!loadJSON('slopeMuted', false);

function loadJSON(k, fallback) {
  try { const v = localStorage.getItem(k); return v === null ? fallback : JSON.parse(v); } catch { return fallback; }
}
function saveJSON(k, v) {
  try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* storage unavailable */ }
}

const rand = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const speedT = (v) => clamp((v - P.startSpeed) / Math.max(1, P.maxSpeed - P.startSpeed), 0, 1);

// ---------------- 8-bit audio: procedural music + SFX ----------------
class Chiptune {
  constructor() {
    this.ctx = null;
    this.playing = false;
    this.tempo = 132;
  }

  // Must be called from a user gesture (iOS unlock)
  ensure() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    if (!this.ctx) {
      const ctx = this.ctx = new AC();
      this.master = ctx.createGain();
      this.master.connect(ctx.destination);
      this.music = ctx.createGain();
      this.sfx = ctx.createGain();
      this.music.connect(this.master);
      this.sfx.connect(this.master);
      this.pulse125 = this.pulseWave(0.125);
      this.pulse25 = this.pulseWave(0.25);
      this.pulse50 = this.pulseWave(0.5);
      // One second of white noise shared by drums and SFX
      this.noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      const d = this.noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      this.applyVolumes();
    }
    if (this.ctx.state !== 'running') this.ctx.resume();
    return true;
  }

  applyVolumes() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    this.master.gain.setTargetAtTime(muted ? 0 : 1, t, 0.02);
    this.music.gain.setTargetAtTime(P.musicVol, t, 0.02);
    this.sfx.gain.setTargetAtTime(P.sfxVol, t, 0.02);
  }

  // NES-style pulse wave with the given duty cycle
  pulseWave(duty) {
    const n = 48;
    const real = new Float32Array(n), imag = new Float32Array(n);
    for (let i = 1; i < n; i++) real[i] = (2 / (i * Math.PI)) * Math.sin(i * Math.PI * duty);
    return this.ctx.createPeriodicWave(real, imag);
  }

  static freq(midi) { return 440 * Math.pow(2, (midi - 69) / 12); }

  tone(wave, midi, t, dur, vol, dest = this.music, slideTo = null) {
    const ctx = this.ctx;
    const osc = ctx.createOscillator();
    if (typeof wave === 'string') osc.type = wave; else osc.setPeriodicWave(wave);
    osc.frequency.setValueAtTime(Chiptune.freq(midi), t);
    if (slideTo !== null) osc.frequency.exponentialRampToValueAtTime(Chiptune.freq(slideTo), t + dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.004);
    g.gain.linearRampToValueAtTime(vol * 0.7, t + dur * 0.6);
    g.gain.linearRampToValueAtTime(0, t + dur);
    osc.connect(g).connect(dest);
    osc.start(t);
    osc.stop(t + dur + 0.02);
  }

  noise(t, dur, vol, type, freq, dest = this.music, freqEnd = null) {
    const ctx = this.ctx;
    const src = ctx.createBufferSource();
    src.buffer = this.noiseBuf;
    const f = ctx.createBiquadFilter();
    f.type = type;
    f.frequency.setValueAtTime(freq, t);
    if (freqEnd !== null) f.frequency.exponentialRampToValueAtTime(freqEnd, t + dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src.connect(f).connect(g).connect(dest);
    src.start(t, Math.random() * 0.5);
    src.stop(t + dur + 0.02);
  }

  kick(t, vol) {
    const ctx = this.ctx;
    const osc = ctx.createOscillator();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(160, t);
    osc.frequency.exponentialRampToValueAtTime(40, t + 0.12);
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
    osc.connect(g).connect(this.music);
    osc.start(t);
    osc.stop(t + 0.18);
  }

  // ----- Song generation -----
  static SCALE = [0, 2, 3, 5, 7, 8, 10]; // natural minor
  static PROGRESSIONS = [[0, 5, 2, 6], [0, 3, 4, 0], [0, 6, 5, 6], [0, 5, 3, 4], [0, 3, 5, 4], [0, 2, 5, 6]];
  static BASS = [
    [0, null, 0, null, 12, null, 0, null, 0, null, 0, null, 12, null, 7, null],
    [0, null, 12, null, 0, null, 12, null, 0, null, 12, null, 0, null, 12, 7],
    [0, null, null, 0, null, null, 0, null, 0, null, null, 0, null, null, 7, null],
    [0, 0, 12, 0, 0, 0, 12, 0, 0, 0, 12, 0, 7, 0, 12, 0],
  ];
  static KICKS = [[0, 8], [0, 6, 8], [0, 8, 10], [0, 3, 8, 11]];

  static semi(deg) {
    const o = Math.floor(deg / 7);
    return 12 * o + Chiptune.SCALE[((deg % 7) + 7) % 7];
  }

  newSong(changeKey = true) {
    if (changeKey || this.root === undefined) this.root = pick([40, 41, 43, 45, 46]); // E2..A#2
    this.prog = pick(Chiptune.PROGRESSIONS);
    this.bassPat = pick(Chiptune.BASS);
    this.kickPat = pick(Chiptune.KICKS);
    this.arpUpDown = Math.random() < 0.5;
    this.leadWave = pick([this.pulse50, this.pulse25]);
    this.phraseA = this.genMelody(0, 64);
    this.phraseB = this.phraseA.slice(0, 48).concat(this.genMelody(48, 64));
  }

  // Random walk over the scale, snapping to chord tones on strong beats
  genMelody(from, to) {
    const out = [];
    let deg = 7 + this.prog[Math.floor(from / 16)];
    for (let s = from; s < to; s++) {
      const pos = s & 15;
      const chord = this.prog[s >> 4];
      const p = pos % 4 === 0 ? 0.65 : pos % 2 === 0 ? 0.3 : 0.1;
      if (s !== from && Math.random() > p) { out.push(null); continue; }
      if (pos % 4 === 0) {
        const tones = [];
        for (let o = 0; o <= 14; o += 7) for (const k of [0, 2, 4]) tones.push(chord + k + o);
        tones.sort((a, b) => Math.abs(a - deg) - Math.abs(b - deg));
        deg = tones[Math.random() < 0.7 ? 0 : 1];
      } else {
        deg += pick([-2, -1, -1, 1, 1, 2]);
      }
      deg = clamp(deg, 2, 14);
      out.push(deg);
    }
    return out;
  }

  start(fresh = true) {
    if (!this.ensure() || this.playing) return;
    this.playing = true;
    if (fresh || !this.prog) { this.newSong(); this.step = 0; }
    this.nextTime = this.ctx.currentTime + 0.06;
    this.timer = setInterval(() => this.schedule(), 25);
  }

  stop() {
    this.playing = false;
    clearInterval(this.timer);
  }

  schedule() {
    if (!this.playing) return;
    const stepDur = 60 / this.tempo / 4;
    while (this.nextTime < this.ctx.currentTime + 0.12) {
      this.playStep(this.step, this.nextTime, stepDur);
      this.nextTime += stepDur;
      this.step++;
    }
  }

  playStep(step, t, sd) {
    const bar = Math.floor(step / 16);
    const pos = step & 15;
    const cycleBar = bar % 16;          // 16-bar song cycle
    const section = cycleBar >> 2;      // four 4-bar phrases
    if (pos === 0 && cycleBar === 0 && bar > 0) this.newSong(Math.random() < 0.5);

    const chordDeg = this.prog[bar & 3];
    const chordRoot = this.root + Chiptune.semi(chordDeg);
    const intensity = this.tempo > 150 ? 1 : 0;

    // Bass (triangle)
    const b = this.bassPat[pos];
    if (b !== null) {
      const long = this.bassPat[(pos + 1) & 15] === null;
      this.tone('triangle', chordRoot + b, t, sd * (long ? 1.8 : 0.9), 0.22);
    }

    // Arpeggio (thin pulse), chord tones one octave up
    const tones = [0, 2, 4, 7].map((k) => this.root + 12 + Chiptune.semi(chordDeg + k));
    const seq = this.arpUpDown ? [0, 1, 2, 3, 2, 1] : [0, 1, 2, 3];
    this.tone(this.pulse125, tones[seq[step % seq.length]], t, sd * 0.8, 0.045);

    // Lead melody enters after the first 4-bar intro
    if (bar >= 4) {
      const phrase = section % 2 === 1 ? this.phraseB : this.phraseA;
      const i = (cycleBar & 3) * 16 + pos;
      const deg = phrase[i];
      if (deg !== null) {
        let len = 1;
        while (len < 6 && i + len < 64 && phrase[i + len] === null) len++;
        this.tone(this.leadWave, this.root + 24 + Chiptune.semi(deg), t, sd * len * 0.9, 0.09);
      }
    }

    // Drums
    if (this.kickPat.includes(pos)) this.kick(t, 0.55);
    const fill = (cycleBar & 3) === 3 && pos >= 12;
    if (pos === 4 || pos === 12 || fill) this.noise(t, 0.12, 0.25, 'bandpass', 1800);
    if (pos % 2 === 0 || intensity) this.noise(t, 0.03, pos % 4 === 2 ? 0.1 : 0.05, 'highpass', 7000);
  }

  // ----- Sound effects -----
  sfxJump() { if (this.ctx) this.tone(this.pulse25, 62, this.ctx.currentTime, 0.18, 0.18, this.sfx, 86); }
  sfxLand() { if (this.ctx) this.noise(this.ctx.currentTime, 0.09, 0.3, 'lowpass', 600, this.sfx); }
  sfxCrash() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    this.noise(t, 0.6, 0.6, 'lowpass', 4000, this.sfx, 150);
    this.tone(this.pulse50, 50, t, 0.4, 0.2, this.sfx, 26);
  }
  sfxFall() { if (this.ctx) this.tone(this.pulse50, 84, this.ctx.currentTime, 0.9, 0.16, this.sfx, 36); }
}

const audio = new Chiptune();

// ---------------- Renderer & scene ----------------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.prepend(renderer.domElement);

const BG = 0x020806;
const scene = new THREE.Scene();
scene.background = new THREE.Color(BG);
scene.fog = new THREE.Fog(BG, 50, 210);

const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.1, 400);

scene.add(new THREE.HemisphereLight(0x99ffbb, 0x001105, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 1.1);
sun.position.set(4, 10, 6);
scene.add(sun);

// Distant grid far below the track gives a sense of height and speed
const grid = new THREE.GridHelper(600, 60, 0x0f4a22, 0x0f4a22);
grid.material.transparent = true;
grid.material.opacity = 0.45;
scene.add(grid);

// ---------------- Materials ----------------
const mats = {
  slab: new THREE.MeshStandardMaterial({ color: 0x07160c, emissive: 0x020b05, roughness: 0.85, metalness: 0.05 }),
  slabEdge: new THREE.LineBasicMaterial({ color: 0x39ff6a }),
  ramp: new THREE.MeshStandardMaterial({ color: 0x06182a, emissive: 0x031424, roughness: 0.6 }),
  rampEdge: new THREE.LineBasicMaterial({ color: 0x3af0ff }),
  obstacle: new THREE.MeshStandardMaterial({ color: 0x3a0610, emissive: 0x6a0718, roughness: 0.5 }),
  obstacleEdge: new THREE.LineBasicMaterial({ color: 0xff3355 }),
};

// Builds a slab (a sheared box) between the start and end of a segment.
// The track runs along -Z: world z = -s.
function buildSlabGeometry(seg) {
  const t = CFG.slabThickness;
  const hw = seg.w / 2;
  const z0 = -seg.s0, z1 = -seg.s1;
  const p = [
    [seg.x0 - hw, seg.y0, z0], [seg.x0 + hw, seg.y0, z0], [seg.x1 + hw, seg.y1, z1], [seg.x1 - hw, seg.y1, z1],             // top
    [seg.x0 - hw, seg.y0 - t, z0], [seg.x0 + hw, seg.y0 - t, z0], [seg.x1 + hw, seg.y1 - t, z1], [seg.x1 - hw, seg.y1 - t, z1], // bottom
  ];
  // Quads wound counter-clockwise when seen from outside
  const quads = [[0, 1, 2, 3], [7, 6, 5, 4], [4, 5, 1, 0], [3, 2, 6, 7], [4, 0, 3, 7], [1, 5, 6, 2]];
  const pos = [];
  for (const [a, b, c, d] of quads) pos.push(...p[a], ...p[b], ...p[c], ...p[a], ...p[c], ...p[d]);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.computeVertexNormals();
  return geo;
}

// ---------------- Procedural track ----------------
class Track {
  constructor(parent) {
    this.group = new THREE.Group();
    parent.add(this.group);
    this.segments = [];
    this.obstacles = [];
  }

  reset() {
    for (const o of this.segments) this.dispose(o);
    for (const o of this.obstacles) this.dispose(o);
    this.segments = [];
    this.obstacles = [];
    // Generator cursor: position where the next piece will be attached
    this.s = 0; this.x = 0; this.y = 0; this.w = 8;
    this.addSeg(45, -0.08 * 45, 0, 8); // safe run-up
  }

  dispose(o) {
    this.group.remove(o.mesh);
    o.mesh.geometry.dispose();
    o.edges.geometry.dispose();
  }

  addSeg(len, dy, dx, w, kind = 'floor') {
    const seg = { s0: this.s, s1: this.s + len, x0: this.x, x1: this.x + dx, y0: this.y, y1: this.y + dy, w, kind };
    const geo = buildSlabGeometry(seg);
    const isRamp = kind === 'ramp';
    const mesh = new THREE.Mesh(geo, isRamp ? mats.ramp : mats.slab);
    const edges = new THREE.LineSegments(new THREE.EdgesGeometry(geo, 1), isRamp ? mats.rampEdge : mats.slabEdge);
    mesh.add(edges);
    seg.mesh = mesh; seg.edges = edges;
    this.group.add(mesh);
    this.segments.push(seg);
    this.s = seg.s1; this.x = seg.x1; this.y = seg.y1; this.w = w;
    return seg;
  }

  addGap(len, drop) {
    this.s += len;
    this.y -= drop;
  }

  addObstacle(seg, s, xOff, bw) {
    const t = (s - seg.s0) / (seg.s1 - seg.s0);
    const cx = lerp(seg.x0, seg.x1, t);
    const y = lerp(seg.y0, seg.y1, t);
    const h = 1.3, d = 1.2, sink = 0.25;
    const geo = new THREE.BoxGeometry(bw, h, d);
    const mesh = new THREE.Mesh(geo, mats.obstacle);
    const edges = new THREE.LineSegments(new THREE.EdgesGeometry(geo), mats.obstacleEdge);
    mesh.add(edges);
    mesh.position.set(cx + xOff, y + h / 2 - sink, -s);
    mesh.rotation.x = Math.atan((seg.y1 - seg.y0) / (seg.s1 - seg.s0)); // follow the slope
    this.group.add(mesh);
    this.obstacles.push({ s, x: cx + xOff, yTop: y + h - sink, w: bw, d, mesh, edges });
  }

  // Returns the surface under (s, x) or null if there is no floor there
  surfaceAt(s, x) {
    for (const seg of this.segments) {
      if (s < seg.s0) break; // segments are sorted, so s is inside a gap
      if (s >= seg.s1) continue;
      const t = (s - seg.s0) / (seg.s1 - seg.s0);
      if (Math.abs(x - lerp(seg.x0, seg.x1, t)) > seg.w / 2) return null;
      return { y: lerp(seg.y0, seg.y1, t), slope: (seg.y1 - seg.y0) / (seg.s1 - seg.s0), kind: seg.kind };
    }
    return null;
  }

  update(ballS, speed) {
    while (this.s < ballS + CFG.viewAhead) {
      // Estimate the speed the ball will have when it reaches the new chunk
      const ahead = Math.max(0, this.s - ballS);
      const est = Math.min(P.maxSpeed, speed + P.accel * ahead / Math.max(speed, 1));
      this.generateChunk(est);
    }
    while (this.segments.length && this.segments[0].s1 < ballS - CFG.keepBehind) this.dispose(this.segments.shift());
    while (this.obstacles.length && this.obstacles[0].s < ballS - CFG.keepBehind) this.dispose(this.obstacles.shift());
  }

  generateChunk(speed) {
    const diff = clamp(this.s / 4000, 0, 1); // difficulty 0..1 grows with distance
    const r = Math.random();
    if (r < 0.2 + 0.1 * diff) this.chunkJump(diff, speed);
    else if (r < 0.35 + 0.15 * diff) this.chunkObstacles(diff);
    else if (r < 0.47 + 0.18 * diff) this.chunkNarrow(diff);
    else if (r < 0.58 + 0.2 * diff) this.chunkSteps();
    else this.chunkWinding(diff);
  }

  chunkWinding(diff) {
    const n = randInt(3, 6);
    const baseW = rand(6.5, 9) - diff * 2.5;
    let dir = Math.random() < 0.5 ? -1 : 1;
    for (let i = 0; i < n; i++) {
      const len = rand(10, 16);
      const dx = dir * len * rand(0.04, 0.12 + 0.15 * diff);
      if (Math.random() < 0.35) dir = -dir;
      this.addSeg(len, -rand(0.1, 0.28) * len, dx, clamp(baseW + rand(-1, 1), 4, 10));
    }
  }

  chunkNarrow(diff) {
    const w = clamp(3.4 - diff * 1.0, 2.3, 4);
    this.addSeg(10, -1, 0, (this.w + w) / 2); // taper in
    const n = randInt(3, 5);
    for (let i = 0; i < n; i++) {
      const len = rand(10, 14);
      this.addSeg(len, -rand(0.08, 0.2) * len, rand(-1, 1) * len * 0.06 * (1 + diff), w);
    }
  }

  chunkSteps() {
    const w = Math.max(this.w, 6);
    const n = randInt(3, 5);
    for (let i = 0; i < n; i++) {
      this.addSeg(rand(8, 12), -0.5, 0, w);
      this.y -= rand(1, 2.2); // vertical drop without a gap
    }
    this.addSeg(14, -1.5, 0, w);
  }

  chunkObstacles(diff) {
    const w = rand(7, 9);
    const n = randInt(2, 4);
    for (let i = 0; i < n; i++) {
      const len = rand(14, 20);
      const seg = this.addSeg(len, -rand(0.08, 0.18) * len, rand(-1, 1) * len * 0.05, w);
      const count = 1 + (Math.random() < diff ? 1 : 0);
      for (let k = 0; k < count; k++) {
        const bw = rand(1.4, 2.6);
        const s = seg.s0 + len * (k + 0.5) / count + rand(-1, 1);
        this.addObstacle(seg, s, rand(-(w - bw) / 2, (w - bw) / 2), bw);
      }
    }
  }

  chunkJump(diff, speed) {
    const w = Math.max(this.w, 6);
    this.addSeg(10, -1, 0, w); // approach
    // Flatter ramps at high speed so the flight does not get absurdly long
    const k = clamp(0.45 - speed * 0.006, 0.2, 0.4);
    const rampLen = 7;
    this.addSeg(rampLen, k * rampLen, 0, w, 'ramp');
    // Ballistic estimate of the jump distance to keep the gap passable
    const drop = rand(1.5, 3.5);
    const vy = k * speed;
    const tFlight = (vy + Math.sqrt(vy * vy + 2 * P.gravity * drop)) / P.gravity;
    const flight = speed * tFlight;
    const gap = Math.min(clamp(speed * 0.3 * (0.85 + 0.3 * diff), 4, 15), flight * 0.6);
    this.addGap(gap, drop);
    this.addSeg(Math.max(22, flight - gap + 12), -2, 0, w); // landing zone
  }
}

const track = new Track(scene);

// ---------------- Ball ----------------
const ballGeo = new THREE.IcosahedronGeometry(CFG.ballRadius, 1);
const ballMat = new THREE.MeshStandardMaterial({ color: 0x9dffb4, emissive: 0x1a6a30, roughness: 0.35, flatShading: true });
const ballMesh = new THREE.Mesh(ballGeo, ballMat);
ballMesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(ballGeo), new THREE.LineBasicMaterial({ color: 0x0b3a18 })));
scene.add(ballMesh);

const glow = new THREE.PointLight(0x55ff88, 18, 14, 2);
scene.add(glow);

const ball = { s: 0, x: 0, y: 0, vx: 0, vy: 0, grounded: true, airTime: 0, lastKind: 'floor' };
const state = { mode: 'menu', speed: P.startSpeed, lastGroundY: 0, overAt: 0, best: loadJSON('slopeBest', 0) | 0 };
const cam = { x: 0, y: 0 };
const rollAxis = new THREE.Vector3();

// ---------------- UI ----------------
const $ = (id) => document.getElementById(id);
const ui = {
  score: $('score'), best: $('best'), overlay: $('overlay'), title: $('title'), msg: $('msg'), hint: $('hint'),
  zl: $('zl'), zr: $('zr'), panel: $('panel'), rows: $('rows'), gear: $('gear'), mute: $('mute'),
};
ui.best.textContent = 'Рекорд: ' + state.best;

function showOverlay(title, msg, hint = '') {
  ui.title.textContent = title;
  ui.msg.textContent = msg;
  ui.hint.textContent = hint;
  ui.overlay.classList.remove('hidden');
}

// ---------------- Settings panel ----------------
const fmt = (s, v) => s.pct ? Math.round(v * 100) + '%' : (s.step < 1 ? (+v).toFixed(s.step < 0.1 ? 2 : 1) : String(v)) + (s.unit || '');
const inputs = {};

function buildSettings() {
  for (const s of SETTINGS) {
    if (s.group) {
      const h = document.createElement('h3');
      h.textContent = s.group;
      ui.rows.appendChild(h);
      continue;
    }
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `<div class="top"><span></span><span class="val"></span></div>` +
      (s.desc ? `<div class="desc"></div>` : '') +
      `<input type="range" min="${s.min}" max="${s.max}" step="${s.step}">`;
    row.querySelector('.top span').textContent = s.label;
    if (s.desc) row.querySelector('.desc').textContent = s.desc;
    const input = row.querySelector('input');
    const val = row.querySelector('.val');
    input.value = P[s.key];
    val.textContent = fmt(s, P[s.key]);
    input.addEventListener('input', () => {
      P[s.key] = parseFloat(input.value);
      val.textContent = fmt(s, P[s.key]);
      saveJSON('slopeSettings', P);
      audio.applyVolumes();
    });
    inputs[s.key] = { input, val, s };
    ui.rows.appendChild(row);
  }
}
buildSettings();

function syncSettingsUI() {
  for (const { input, val, s } of Object.values(inputs)) {
    input.value = P[s.key];
    val.textContent = fmt(s, P[s.key]);
  }
}

function openSettings() {
  if (state.settingsOpen) return;
  state.settingsOpen = true;
  if (state.mode === 'play') { state.mode = 'paused'; audio.stop(); }
  pointers.clear();
  ui.overlay.classList.add('hidden');
  ui.panel.classList.remove('hidden');
}

function closeSettings() {
  state.settingsOpen = false;
  ui.panel.classList.add('hidden');
  if (state.mode === 'paused') showOverlay('ПАУЗА', 'Нажми, чтобы продолжить');
  else ui.overlay.classList.remove('hidden');
}

ui.gear.addEventListener('click', () => (state.settingsOpen ? closeSettings() : openSettings()));
$('done').addEventListener('click', closeSettings);
$('reset').addEventListener('click', () => {
  Object.assign(P, DEFAULTS);
  saveJSON('slopeSettings', P);
  syncSettingsUI();
  audio.applyVolumes();
});

function updateMuteIcon() { ui.mute.classList.toggle('off', muted); }
updateMuteIcon();
ui.mute.addEventListener('click', () => {
  muted = !muted;
  saveJSON('slopeMuted', muted);
  audio.ensure();
  audio.applyVolumes();
  updateMuteIcon();
});

// ---------------- Input ----------------
const pointers = new Map(); // pointerId -> -1 (left) or +1 (right)
const keys = { left: false, right: false };
const isUi = (e) => !!(e.target && e.target.closest && e.target.closest('.ui'));

function steerInput() {
  let l = keys.left, r = keys.right;
  for (const side of pointers.values()) { if (side < 0) l = true; else r = true; }
  ui.zl.classList.toggle('on', l);
  ui.zr.classList.toggle('on', r);
  return (r ? 1 : 0) - (l ? 1 : 0);
}

function onTap() {
  if (state.settingsOpen) return;
  if (state.mode === 'menu') startGame();
  else if (state.mode === 'paused') resumeGame();
  else if (state.mode === 'over' && performance.now() - state.overAt > 700) startGame();
}

window.addEventListener('pointerdown', (e) => {
  if (isUi(e)) return;
  e.preventDefault();
  audio.ensure(); // unlock audio inside a user gesture
  if (state.mode !== 'play') { onTap(); return; }
  pointers.set(e.pointerId, e.clientX < innerWidth / 2 ? -1 : 1);
}, { passive: false });
window.addEventListener('pointermove', (e) => {
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId, e.clientX < innerWidth / 2 ? -1 : 1);
});
const releasePointer = (e) => pointers.delete(e.pointerId);
window.addEventListener('pointerup', releasePointer);
window.addEventListener('pointercancel', releasePointer);
// Block iOS scrolling / zoom gestures everywhere except the settings UI
document.addEventListener('touchstart', (e) => { if (!isUi(e)) e.preventDefault(); }, { passive: false });
document.addEventListener('touchmove', (e) => { if (!isUi(e)) e.preventDefault(); }, { passive: false });
// iOS sometimes only unlocks audio on touchend
document.addEventListener('touchend', () => audio.ensure(), { passive: true });

window.addEventListener('keydown', (e) => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
  if (e.code === 'Escape') state.settingsOpen ? closeSettings() : openSettings();
  if ((e.code === 'Space' || e.code === 'Enter') && !state.settingsOpen) { audio.ensure(); onTap(); }
});
window.addEventListener('keyup', (e) => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
});

document.addEventListener('visibilitychange', () => {
  if (document.hidden && state.mode === 'play') {
    state.mode = 'paused';
    audio.stop();
    pointers.clear();
    if (!state.settingsOpen) showOverlay('ПАУЗА', 'Нажми, чтобы продолжить');
  }
});

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---------------- Game flow ----------------
function startGame() {
  track.reset();
  Object.assign(ball, { s: 4, x: 0, vx: 0, vy: 0, grounded: true, airTime: 0, lastKind: 'floor' });
  ball.y = track.surfaceAt(ball.s, 0).y + CFG.ballRadius;
  state.speed = P.startSpeed;
  state.lastGroundY = ball.y;
  state.mode = 'play';
  cam.x = ball.x; cam.y = ball.y;
  ballMesh.quaternion.identity();
  ballMat.color.set(0x9dffb4);
  ballMat.emissive.set(0x1a6a30);
  pointers.clear();
  ui.overlay.classList.add('hidden');
  track.update(ball.s, state.speed);
  audio.stop();
  audio.start(true);
}

function resumeGame() {
  state.mode = 'play';
  ui.overlay.classList.add('hidden');
  audio.start(false);
}

function gameOver(reason) {
  state.mode = 'over';
  state.overAt = performance.now();
  pointers.clear();
  audio.stop();
  if (reason === 'crash') audio.sfxCrash(); else audio.sfxFall();
  const score = Math.floor(ball.s);
  const record = score > state.best;
  if (record) { state.best = score; saveJSON('slopeBest', score); ui.best.textContent = 'Рекорд: ' + score; }
  if (reason === 'crash') { ballMat.color.set(0xff4466); ballMat.emissive.set(0x6a0718); }
  showOverlay(reason === 'crash' ? 'РАЗБИЛСЯ!' : 'УПАЛ!',
    `${score} м${record ? ' — новый рекорд!' : ''}`,
    'Нажми, чтобы сыграть ещё');
}

// ---------------- Physics (fixed step) ----------------
function step(dt) {
  const r = CFG.ballRadius;
  state.speed = clamp(state.speed + P.accel * dt, 0, Math.max(P.maxSpeed, P.startSpeed));

  // Lateral motion with inertia: m * dvx/dt = F_steer - grip * vx
  const sf = 1 + state.speed * CFG.steerSpeedGain;
  const force = steerInput() * P.steerForce * sf * (ball.grounded ? 1 : P.airControl);
  const drag = (ball.grounded ? P.grip : P.grip * CFG.airDragFactor) * ball.vx;
  ball.vx += (force - drag) / P.mass * dt;
  const vxMax = Math.min(40, 1.5 * P.steerForce * sf / P.grip);
  ball.vx = clamp(ball.vx, -vxMax, vxMax);

  ball.s += state.speed * dt;
  ball.x += ball.vx * dt;
  ball.vy -= P.gravity * dt;
  ball.y += ball.vy * dt;

  // Ground contact
  const surf = track.surfaceAt(ball.s, ball.x);
  let grounded = false;
  if (surf) {
    const diff = (ball.y - r) - surf.y;                   // > 0: ball is above the surface
    const sinkTol = CFG.stepTolerance + state.speed * dt;  // allowed penetration this step
    const stickTol = ball.grounded ? 0.25 : 0;            // keeps the ball glued on downhill bends
    if (diff <= stickTol && diff >= -sinkTol) {
      ball.y = surf.y + r;
      ball.vy = surf.slope * state.speed; // keeps momentum, so ramps launch the ball
      grounded = true;
      state.lastGroundY = surf.y;
      if (!ball.grounded && ball.airTime > 0.3) audio.sfxLand();
      ball.lastKind = surf.kind;
    } else if (diff < -sinkTol && diff > -(CFG.slabThickness + 2 * r)) {
      gameOver('crash'); // hit the front face of a higher slab
      return;
    }
  }
  if (ball.grounded && !grounded && ball.lastKind === 'ramp') audio.sfxJump();
  ball.airTime = grounded ? 0 : ball.airTime + dt;
  ball.grounded = grounded;

  // Obstacles
  const hitPad = r * 0.7;
  for (const o of track.obstacles) {
    if (o.s - ball.s > 3) break;
    if (Math.abs(ball.s - o.s) < o.d / 2 + hitPad &&
        Math.abs(ball.x - o.x) < o.w / 2 + hitPad &&
        ball.y - r < o.yTop) {
      gameOver('crash');
      return;
    }
  }

  if (ball.y < state.lastGroundY - CFG.fallLimit) gameOver('fall');
}

// ---------------- Visuals ----------------
function updateVisuals(dt) {
  ballMesh.position.set(ball.x, ball.y, -ball.s);
  glow.position.set(ball.x, ball.y + 1.5, -ball.s);

  if (state.mode === 'play') {
    // Rolling: angular velocity = up x velocity / radius
    const vz = -state.speed;
    rollAxis.set(vz, 0, -ball.vx);
    const len = rollAxis.length();
    if (len > 1e-4) ballMesh.rotateOnWorldAxis(rollAxis.divideScalar(len), (len / CFG.ballRadius) * dt);
  }

  // Camera: behind and above, smooth on X/Y, locked on the forward axis
  const k = 1 - Math.exp(-dt * 6);
  cam.x += (ball.x - cam.x) * k;
  const targetY = Math.max(ball.y, state.lastGroundY - 1); // do not follow the ball into the abyss
  cam.y += (targetY - cam.y) * (1 - Math.exp(-dt * 4));
  camera.position.set(cam.x, cam.y + 3.4, -ball.s + 7.5);
  camera.lookAt(cam.x, cam.y + 0.4, -ball.s - 12);
  camera.rotateZ(-ball.vx * 0.008);
  const fov = 62 + speedT(state.speed) * 16;
  if (Math.abs(camera.fov - fov) > 0.05) { camera.fov = fov; camera.updateProjectionMatrix(); }

  grid.position.set(Math.round(ball.x / 10) * 10, state.lastGroundY - 45, -Math.round(ball.s / 10) * 10);

  // Slowly shift the neon color with distance
  const hue = (0.37 + ball.s / 5000) % 1;
  mats.slabEdge.color.setHSL(hue, 1, 0.58);
  mats.rampEdge.color.setHSL((hue + 0.18) % 1, 1, 0.6);

  ui.score.textContent = Math.floor(ball.s);
}

// ---------------- Main loop ----------------
let last = performance.now();
let acc = 0;

function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;

  if (state.mode === 'play') {
    acc += dt;
    while (acc >= CFG.fixedDt) {
      step(CFG.fixedDt);
      acc -= CFG.fixedDt;
      if (state.mode !== 'play') { acc = 0; break; }
    }
    track.update(ball.s, state.speed);
    audio.tempo = 132 + speedT(state.speed) * 38; // music speeds up with the ball
  } else {
    steerInput(); // refresh zone highlighting
  }

  updateVisuals(dt);
  renderer.render(scene, camera);
}

// Show the track behind the start menu
track.reset();
ball.y = CFG.ballRadius;
track.update(0, P.startSpeed);
requestAnimationFrame(frame);
</script>
</body>
</html>
